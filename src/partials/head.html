<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="canonical" href="{{page.url}}">
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
<link rel="stylesheet" href="{{assets.css}}">
<link rel="icon" href="/assets/logo.svg?v={{assets.rev}}" type="image/svg+xml">
<link rel="icon" href="/assets/favicon-32.png?v={{assets.rev}}" sizes="32x32" type="image/png">
<link rel="icon" href="/assets/favicon-16.png?v={{assets.rev}}" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v={{assets.rev}}">
<meta name="theme-color" content="#161A38">
<meta property="og:site_name" content="{{site.name}}">
<meta property="og:type" content="website">
<meta property="og:locale" content="{{site.locale}}">
<meta property="og:url" content="{{page.url}}">
<meta property="og:image" content="{{site.url}}/assets/og.png?v={{assets.rev}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<script type="application/ld+json">{{{jsonld.organization}}}</script>
<script type="application/ld+json">{{{jsonld.website}}}</script>
