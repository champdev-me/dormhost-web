{{> icons}}
<div class="wrap">
  <nav class="nav">
    <a class="brand" href="/"><img class="brand-mark" src="/assets/logo.svg" width="22" height="22" alt="">{{site.name}}</a>
    <!-- From content.json's nav, which also feeds the SiteNavigationElement
         JSON-LD. One list, so the markup and what we tell search engines
         cannot drift apart. Contact is in the header and not only the footer:
         a payment processor's review looks for a contact tab, and the address
         sits on that page. -->
    <div class="nav-links">
      {{#each nav}}<a href="{{href}}">{{name}}</a>{{/each}}
      <a class="nav-cta" href="{{site.dashboardUrl}}">Deploy for free</a>
    </div>
  </nav>
</div>
